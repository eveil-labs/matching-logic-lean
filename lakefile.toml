name = "matchinglogic"
defaultTargets = ["MatchingLogic"]

# Mathlib v4.33.0 (db584cd6d46c92f209a44c0f1c829460d327499d).
# Pinned to a public tag so this repository builds for anyone:
#   lake exe cache get && lake build
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "MatchingLogic"

# Axiom auditing is NOT hand-rolled here. `lake exe axiom-audit` asks the kernel
# which axioms every declaration in the library depends on and fails if any is
# outside [propext, Classical.choice, Quot.sound] -- catching `sorry` (sorryAx),
# `native_decide` (Lean.ofReduceBool) and any home-rolled axiom, transitively.
#
# It identifies our declarations by their DECLARING MODULE (`--root`), not by
# name, which is the property round nine of our own review had to be beaten into
# our scripts three times. Fire-tested here against round nine's own exploit: it
# reports `Smuggle.soundness`, which sits outside the `MatchingLogic` namespace
# entirely, and a `private axiom`, both of which name-based scans walked past.
# Pinned to a commit hash, not `main`: this tool's exit code alone decides the
# flagship kernel-level CI gate, so its revision should move only by a reviewed
# edit here -- never as a side effect of `lake update`.
[[require]]
name = "axiomAudit"
git = "https://github.com/leanprover-community/axiom-audit"
rev = "1a9c3c28cbaf4a04ba29aae7fa4d5ef04e000e9d"

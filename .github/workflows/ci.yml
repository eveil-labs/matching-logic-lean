name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build-args: MatchingLogic

      # A green `lake build` is NOT evidence that anything is proved: the build
      # succeeds with `sorry`s present, emitting only warnings. The gates below
      # are the actual evidence.
      - name: No sorry in files claimed complete
        run: ./scripts/audit-files.sh

      - name: Axiom audit
        run: ./scripts/audit.sh

      # The kernel-level axiom audit, and NOT one of ours: `axiom-audit` from
      # leanprover-community. It asks the kernel which axioms each declaration
      # depends on and fails outside [propext, Classical.choice, Quot.sound],
      # catching sorry (sorryAx), native_decide (Lean.ofReduceBool) and any
      # home-rolled axiom, transitively -- across every declaration the library
      # holds, where our own gate checks only the names in gate/certified.txt.
      - name: Axiom audit (leanprover-community/axiom-audit)
        run: lake exe axiom-audit

      # Every module must be reachable from the library root, or `import
      # MatchingLogic` -- how the pin generator, the axiom audit and this build
      # all reach the code -- covers less than the repository contains. Standard
      # tool, free with Mathlib. Measured on the entry-(iii) branch: it adds 29
      # missing imports that four of our gates had reported clean.
      - name: Every module is imported by the root
        run: lake exe mk_all --check

      # Ours, and narrower than the two above: it rejects an `axiom` or `opaque`
      # DECLARATION even when nothing depends on it, and any private name leaking
      # into a public type, which is a policy the dependency audit does not
      # express. (Private definitions themselves are allowed; the (iii)
      # development needs them.)
      - name: No axiom or opaque declarations, no private names in public types
        run: ./scripts/audit-axiom-decls.sh

      # Pins what each name SAYS, not merely that it exists with clean axioms.
      # The axiom gate accepts any declaration, including a definition carrying a
      # theorem's name; this one compares kernel-printed statement types and
      # definition bodies against a baseline.
      # The manifests are what the other gates read. An audit shrank them and
      # passed everything, so they are checked too.
      - name: Manifest is intact
        run: ./scripts/audit-manifest.sh

      - name: Pinned statements and definitions
        run: ./scripts/audit-pinned.sh

      # Cross-method: the generator enumerates from Lean's environment, this
      # reads the source text and requires each declaration to be pinned. An
      # earlier version shared the generator's logic and so compared it against
      # itself, reporting full coverage while a dozen names were missing.
      - name: Every declaration is pinned
        run: ./scripts/audit-coverage.sh

      # gate/pinned.lean is generated. If it has been hand-edited to drop
      # checks, the pinned gate would still pass against a matching baseline.
      - name: Pinned files are regenerable
        run: |
          ./scripts/gen-pinned.sh
          ./scripts/gen-variants-baseline.sh
          ./scripts/gen-required.sh
          git diff --exit-code -- gate/pinned.lean gate/variants/ gate/required.txt

      - name: Variant gate
        run: ./scripts/audit-variants.sh

      # Entry point (iii): its own per-module pin files and certified list,
      # carried over from the branch the construction was built on.
      - name: Entry point (iii) gate
        run: ./scripts/audit-entry-iii.sh

      # The correspondence table is GENERATED from gate/certified.txt and the
      # kernel's own axiom output. If it has drifted from the source, the table
      # in the repository is claiming something the kernel is not confirming.
      - name: Correspondence table is current
        run: |
          ./scripts/correspondence.sh > /tmp/corr.md
          diff -u CORRESPONDENCE.md /tmp/corr.md
